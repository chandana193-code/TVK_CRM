<div class="payment-container">

    <div class="payment-header">
        <h2>Registration Payment</h2>
        <p>Complete your registration by scanning the QR code</p>
    </div>

    <div class="payment-body">

        <div class="qr-section">

            <img src="assets/QR_CODE.jpeg"
                 class="qr-image"
                 alt="QR Code">

            <p class="scan-text">
                Scan using PhonePe, Google Pay or Paytm
            </p>

        </div>

        <div class="payment-info">

            <h3>Registration Fee</h3>

            <h1>₹500</h1>

            <label>Transaction ID</label>

            <input
                type="text"
                placeholder="Enter Transaction ID">

            <button>
                Verify Payment
            </button>

            <p class="secure">
                Secure UPI Payment
            </p>

        </div>

    </div>

</div>
